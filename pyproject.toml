[project]
name = "llm-question-bank"
version = "0.1.0"
description = "LLM-Powered Question Bank (POC): generate exam questions from PDFs with local or cloud LLMs, review them, and store them in MongoDB."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Muhammad Rafiq" }]
keywords = ["llm", "question-generation", "education", "ollama", "mlx", "llama-3", "openai", "fastapi", "nextjs", "mongodb"]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.6",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pymongo>=4.6",
    "motor>=3.3",
    "pymupdf4llm>=0.0.5",
    "requests>=2.31",
    "openai>=1.10",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Run Llama 3 locally on Apple Silicon with MLX
mlx = [
    "mlx>=0.10; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-lm>=0.10; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.urls]
Repository = "https://github.com/MRafiqAsim/llm-question-bank"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.6", "pre-commit>=3.7"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "UP042"]  # UP042: StrEnum would change str() of the enums
